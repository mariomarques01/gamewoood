name: Validate and deploy Godot Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deadlight-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and Web templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          python3 - <<'PY'
          import os, zipfile
          target = os.path.expanduser('~/.local/share/godot/export_templates/4.3.stable')
          os.makedirs(target, exist_ok=True)
          with zipfile.ZipFile('/tmp/templates.tpz') as archive:
              for name in ('web_release.zip', 'web_debug.zip', 'web_nothreads_release.zip', 'web_nothreads_debug.zip', 'version.txt'):
                  with open(os.path.join(target, name), 'wb') as output:
                      output.write(archive.read('templates/' + name))
          PY
      - name: Validate runtime and export
        run: tools/validate.sh --export
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Test exported game in browser
        run: |
          python3 tests/web_pwa.py --directory build/web
          python3 tests/web_smoke.py --directory build/web
          python3 tests/web_finale.py --directory build/web-finale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: build/logs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
