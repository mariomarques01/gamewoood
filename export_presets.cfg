[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/*OFL.txt,assets/hud/*.json,assets/audio/*.txt,assets/audio/*.md,assets/audio/*.json"
exclude_filter="tests/*,tools/*,docs/*,build/*"
export_path="build/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#10252f\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<script>\n// Resume Web Audio inside the trusted DOM gesture, before Godot processes input.\n(() => {\n  window.deadlightRequestLandscape = () => {\n    if (!navigator.maxTouchPoints) return;\n    const lock = () => {\n      if (screen.orientation && screen.orientation.lock)\n        screen.orientation.lock('landscape').catch(() => {});\n    };\n    const target = document.documentElement;\n    if (!document.fullscreenElement && target.requestFullscreen)\n      target.requestFullscreen().then(lock).catch(lock);\n    else lock();\n  };\n  const Base = window.AudioContext || window.webkitAudioContext;\n  if (!Base) return;\n  const contexts = new Set();\n  const Wrapped = new Proxy(Base, {construct(target, args) {\n    const ctx = Reflect.construct(target, args);\n    contexts.add(ctx);\n    return ctx;\n  }});\n  window.AudioContext = Wrapped;\n  if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;\n  const resume = () => {\n    for (const ctx of contexts) {\n      if (ctx.state === 'closed') contexts.delete(ctx);\n      else if (ctx.state === 'suspended') ctx.resume().catch(() => {});\n    }\n  };\n  for (const event of ['pointerdown', 'touchstart', 'touchend', 'keydown'])\n    document.addEventListener(event, resume, {capture: true, passive: true});\n})();\n</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/pwa/icon-512.png"
progressive_web_app/icon_180x180="res://assets/pwa/icon-512.png"
progressive_web_app/icon_512x512="res://assets/pwa/icon-512.png"
progressive_web_app/background_color=Color(0.0627451, 0.145098, 0.184314, 1)
