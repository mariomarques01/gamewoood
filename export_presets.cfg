variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>\n// Resume Web Audio inside the trusted DOM gesture, before Godot processes input.\n(() => {\n  const Base = window.AudioContext || window.webkitAudioContext;\n  if (!Base) return;\n  const contexts = new Set();\n  const Wrapped = new Proxy(Base, {construct(target, args) {\n    const ctx = Reflect.construct(target, args);\n    contexts.add(ctx);\n    return ctx;\n  }});\n  window.AudioContext = Wrapped;\n  if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;\n  const resume = () => {\n    for (const ctx of contexts) {\n      if (ctx.state === 'closed') contexts.delete(ctx);\n      else if (ctx.state === 'suspended') ctx.resume().catch(() => {});\n    }\n  };\n  for (const event of ['pointerdown', 'touchstart', 'touchend', 'keydown'])\n    document.addEventListener(event, resume, {capture: true, passive: true});\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
